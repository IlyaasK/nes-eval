[package]
name = "nes_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A plain from-scratch NES emulator: NES Eval's baseline candidate"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

# Standalone crate: not a member of the grader workspace at the repo root.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
